<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>浚鍵管理有限公司 - 行車記錄表</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <style>
        /* ===== 主題變數：全方位美化配色（含全新優化深色模式） ===== */
        :root {
            --bg-body: #f4f6f9;
            --bg-card: #ffffff;
            --text-main: #2c3e50;
            --text-label: #596780;
            --text-title: #1e3a8a;
            --border: #e2e8f0;
            --border-light: #edf2f7;
            --th-bg: #f8fafc;
            --th-text: #334155;
            --summary-bg: #fef3c7;
            --month-summary-bg: #f3e8ff;
            --btn-add: #2563eb;
            --btn-export: #059669;
            --btn-search: #7c3aed;
            --btn-del-bg: #fee2e2;
            --btn-del-text: #991b1b;
            --tab-bg: #e2e8f0;
            --tab-text: #64748b;
            --tab-active: #2563eb;
            --cloud-ok: #059669;
            --cloud-err: #dc2626;
            --section-title: #2563eb;
            --shadow: rgba(0, 0, 0, 0.04);
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;         /* 極致舒適的高級石墨深灰，告別刺眼深藍 */
            --bg-card: #1e293b;         /* 層次分明的柔和深碳灰卡片背景 */
            --text-main: #f1f5f9;       /* 高對比且柔和的亮白字體 */
            --text-label: #94a3b8;      /* 柔和清晰的標籤灰字 */
            --text-title: #60a5fa;      /* 清爽柔和的科技藍主標題 */
            --border: #334155;          /* 精緻柔和的暗灰邊框 */
            --border-light: #273548;
            --th-bg: #334155;
            --th-text: #f8fafc;
            --summary-bg: #451a03;      /* 沉穩琥珀總結底色 */
            --month-summary-bg: #3b0764;  /* 沉穩紫羅蘭總結底色 */
            --btn-add: #3b82f6;
            --btn-export: #10b981;
            --btn-search: #8b5cf6;
            --btn-del-bg: #7f1d1d;
            --btn-del-text: #fecaca;
            --tab-bg: #334155;
            --tab-text: #94a3b8;
            --tab-active: #3b82f6;
            --cloud-ok: #34d399;
            --cloud-err: #f87171;
            --section-title: #60a5fa;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 12px; background-color: var(--bg-body); color: var(--text-main); transition: background-color 0.3s, color 0.3s; }
        .card { background: var(--bg-card); padding: 16px; border-radius: 12px; box-shadow: 0 4px 12px var(--shadow); margin-bottom: 12px; transition: background-color 0.3s, box-shadow 0.3s; border: 1px solid var(--border); }
        h2 { text-align: center; font-size: 18px; margin: 0 0 12px 0; color: var(--text-title); }
        label { display: block; font-size: 13px; font-weight: bold; margin-top: 8px; color: var(--text-label); }
        input, select, button { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; background: var(--bg-card); color: var(--text-main); transition: border-color 0.2s, background-color 0.3s, color 0.3s; }
        input:focus, select:focus { outline: none; border-color: var(--tab-active); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
        .row { display: flex; gap: 8px; }
        .row > div { flex: 1; }
        .btn-add { background-color: var(--btn-add); color: white; font-weight: bold; border: none; margin-top: 14px; cursor: pointer; transition: opacity 0.2s; }
        .btn-add:hover { opacity: 0.9; }
        .btn-export { background-color: var(--btn-export); color: white; font-weight: bold; border: none; margin-top: 8px; cursor: pointer; transition: opacity 0.2s; }
        .btn-export:hover { opacity: 0.9; }
        .btn-search { background-color: var(--btn-search); color: white; font-weight: bold; border: none; margin-top: 8px; cursor: pointer; transition: opacity 0.2s; }
        .btn-search:hover { opacity: 0.9; }
        .btn-del { background-color: var(--btn-del-bg); color: var(--btn-del-text); border: none; padding: 4px 6px; border-radius: 4px; font-size: 11px; width: auto; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 11px; }
        th, td { border: 1px solid var(--border-light); padding: 6px 2px; text-align: center; }
        th { background-color: var(--th-bg); color: var(--th-text); }
        .summary { font-weight: bold; background-color: var(--summary-bg); font-size: 13px; color: var(--text-main); border: 1px solid rgba(245, 158, 11, 0.3); }
        .month-summary { font-weight: bold; background-color: var(--month-summary-bg); font-size: 13px; color: var(--text-main); border: 1px solid rgba(147, 51, 234, 0.3); }
        .section-title { font-size: 13px; color: var(--section-title); margin-top: 12px; font-weight: bold; border-bottom: 1px solid var(--border-light); padding-bottom: 4px; }
        .nav-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
        .nav-tabs button { flex: 1; padding: 10px; background: var(--tab-bg); border: none; font-weight: bold; color: var(--tab-text); cursor: pointer; border-radius: 8px; transition: background 0.2s, color 0.2s; }
        .nav-tabs button.active { background: var(--tab-active); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .cloud-status { font-size: 11px; text-align: center; color: var(--cloud-ok); margin-top: -8px; margin-bottom: 8px; font-weight: bold; }
        .cloud-status.error { color: var(--cloud-err); }

        /* ===== 主題切換按鈕 ===== */
        .theme-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            width: auto;
            padding: 8px 12px;
            font-size: 18px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-main);
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 2px 8px var(--shadow);
        }

        /* ===== 豪華版 Excel 匯出區 ===== */
        .luxury-section {
            border: 2px solid var(--btn-search);
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
            background: rgba(124, 58, 237, 0.03);
        }
        .luxury-section h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: var(--btn-search);
        }
        .luxury-buttons {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .luxury-buttons button {
            flex: 1;
            padding: 10px 6px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }
        .luxury-buttons button:hover { opacity: 0.9; }
        .btn-luxury-1 { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); }
        .btn-luxury-2 { background: linear-gradient(135deg, #ec4899 0%, #be185d 100%); }
        .btn-luxury-3 { background: linear-gradient(135deg, #06b6d4 0%, #0e7490 100%); }
    </style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切換深色/淺色">🌙</button>
<h2>浚鍵管理有限公司<br><small style="font-size:14px; font-weight:normal; opacity:0.8;">行車記錄表 (豪華版)</small></h2>
<div class="cloud-status" id="cloudStatus">☁️ 雲端狀態：連線中...</div>

<div class="nav-tabs">
    <button id="tabBtn1" class="active" onclick="switchTab('tab1')">📝 日常輸入 / 抽查單日</button>
    <button id="tabBtn2" onclick="switchTab('tab2')">🔍 全年 / 月度歷史分析</button>
</div>

<div id="tab1" class="tab-content active">
    <div class="card">
        <label style="color:var(--section-title);">📅 選擇 / 切換日期</label>
        <input type="date" id="recordDate" onchange="switchDate()">

        <div class="row">
            <div>
                <label>車牌</label>
                <input type="text" id="carPlate" placeholder="例如: AB1234" onchange="saveBasicInfo()">
            </div>
        </div>

        <div class="row">
            <div>
                <label>早更司機</label>
                <input type="text" id="dayDriver" placeholder="司機姓名" onchange="saveBasicInfo()">
            </div>
            <div>
                <label>夜更司機</label>
                <input type="text" id="nightDriver" placeholder="司機姓名" onchange="saveBasicInfo()">
            </div>
        </div>
    </div>

    <div class="card">
        <h3 style="margin:0 0 8px 0; font-size:15px;">新增班次紀錄</h3>
        <div class="row">
            <div>
                <label>更次</label>
                <select id="shiftType">
                    <option value="早更">早更</option>
                    <option value="夜更">夜更</option>
                </select>
            </div>
            <div>
                <label>目的地</label>
                <select id="destination"></select>
            </div>
        </div>

        <div class="row">
            <div>
                <label>開出時間</label>
                <input type="time" id="departTime">
            </div>
        </div>

        <div class="section-title">八達通 / 電子支付人次</div>
        <div class="row">
            <div>
                <label>電子 $9</label>
                <input type="number" id="count9Elec" value="0" min="0" inputmode="numeric">
            </div>
            <div>
                <label>電子 $6</label>
                <input type="number" id="count6Elec" value="0" min="0" inputmode="numeric">
            </div>
        </div>

        <div class="section-title">現金支付人次</div>
        <div class="row">
            <div>
                <label>現金 $9</label>
                <input type="number" id="count9Cash" value="0" min="0" inputmode="numeric">
            </div>
            <div>
                <label>現金 $6</label>
                <input type="number" id="count6Cash" value="0" min="0" inputmode="numeric">
            </div>
        </div>

        <button class="btn-add" onclick="addTrip()">＋ 加入並同步至雲端</button>
    </div>

    <div class="card">
        <h3 style="margin:0 0 8px 0; font-size:15px;">當日班次明細 (雲端同步)</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>更次</th>
                        <th>司機</th>
                        <th>時間</th>
                        <th>方向</th>
                        <th>電$9</th>
                        <th>電$6</th>
                        <th>現$9</th>
                        <th>現$6</th>
                        <th>小計</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tripBody"></tbody>
            </table>
        </div>
        <div id="totalSummary" class="summary" style="padding: 10px; margin-top: 10px; border-radius: 6px;">
            當日總收入：$0
        </div>
        <button class="btn-export" onclick="exportDayCSV()">📊 匯出當日 CSV</button>
    </div>
</div>

<div id="tab2" class="tab-content">
    <div class="card">
        <h3 style="margin:0 0 8px 0; font-size:15px; color:var(--btn-search);">🔍 雲端月度數據檢索</h3>
        <div class="row">
            <div>
                <label>選擇月份</label>
                <input type="month" id="searchMonth">
            </div>
            <div>
                <label>過濾更次</label>
                <select id="searchShift">
                    <option value="ALL">全部更次</option>
                    <option value="早更">單獨看：早更</option>
                    <option value="夜更">單獨看：夜更</option>
                </select>
            </div>
        </div>
        <button class="btn-search" onclick="analyzeMonth()">🔎 查詢雲端數據</button>
    </div>

    <div class="card">
        <h3 style="margin:0 0 8px 0; font-size:15px;">月度分析結果</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>更次</th>
                        <th>司機</th>
                        <th>班次數</th>
                        <th>電$9</th>
                        <th>電$6</th>
                        <th>現$9</th>
                        <th>現$6</th>
                        <th>收入小計</th>
                    </tr>
                </thead>
                <tbody id="monthBody">
                    <tr><td colspan="9">請選擇月份並按下「查詢」</td></tr>
                </tbody>
            </table>
        </div>
        <div id="monthSummary" class="month-summary" style="padding: 10px; margin-top: 10px; border-radius: 6px;">
            月度總結：請先進行查詢
        </div>
        <button class="btn-export" style="background-color:var(--btn-search);" onclick="exportMonthCSV()">📥 匯出此月份 CSV</button>

        <!-- ===== 豪華版 Excel 匯出區 ===== -->
        <div class="luxury-section">
            <h4>💎 豪華版 Excel 匯出</h4>
            <p style="font-size:11px; color:var(--text-label); margin:4px 0;">包含大型標題、文字顯示框、統計摘要及 A4 自動分頁</p>
            <label>自定開始日期</label>
            <input type="date" id="luxStartDate">
            <label>自定結束日期</label>
            <input type="date" id="luxEndDate">

            <div class="luxury-buttons">
                <button class="btn-luxury-1" onclick="exportLuxuryExcel('firstHalf')">上半個月<br><small>1–15 號</small></button>
                <button class="btn-luxury-2" onclick="exportLuxuryExcel('secondHalf')">下半個月<br><small>16–月底</small></button>
                <button class="btn-luxury-3" onclick="exportLuxuryExcel('custom')">自定日期<br><small>自選範圍</small></button>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== Firebase 設定（新專案：driver-s-shift-report） =====
    const firebaseConfig = {
        apiKey: "AIzaSyANWLqV5bIFfMX_-byunnEBQ-gZmSn1cj4",
        authDomain: "driver-s-shift-report.firebaseapp.com",
        databaseURL: "https://driver-s-shift-report-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "driver-s-shift-report",
        storageBucket: "driver-s-shift-report.firebasestorage.app",
        messagingSenderId: "790331468274",
        appId: "1:790331468274:web:a0cecd6a8d5f8e157ba36b",
        measurementId: "G-JZSZKCSS27"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // ===== 常量 =====
    const DESTINATIONS = [
        "去 西鐵元朗站",
        "去 大棠/黃泥墩"
    ];
    const PRICE_9 = 9;
    const PRICE_6 = 6;

    // ===== 狀態 =====
    let currentDate = "";
    let currentDayData = { plate: "", dayDriver: "", nightDriver: "", trips: [] };
    let activeListener = null;
    let activeListenerDate = "";

    // ===== 主題 =====
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const toggleBtn = document.getElementById('themeToggle');
        if (toggleBtn) toggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
        localStorage.setItem('theme', theme);
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        applyTheme(current === 'dark' ? 'light' : 'dark');
    }

    function initTheme() {
        const saved = localStorage.getItem('theme');
        if (saved) {
            applyTheme(saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            applyTheme('dark');
        } else {
            applyTheme('light');
        }
    }

    // ===== 初始化 =====
    document.addEventListener('DOMContentLoaded', function() {
        initTheme();

        const today = new Date().toISOString().split('T')[0];
        const recordDateEl = document.getElementById('recordDate');
        const searchMonthEl = document.getElementById('searchMonth');
        const luxStartEl = document.getElementById('luxStartDate');
        const luxEndEl = document.getElementById('luxEndDate');

        if (recordDateEl) recordDateEl.value = today;
        if (searchMonthEl) searchMonthEl.value = today.substring(0, 7);
        if (luxStartEl) luxStartEl.value = today.substring(0, 7) + '-01';
        if (luxEndEl) luxEndEl.value = today;

        const destSelect = document.getElementById('destination');
        if (destSelect) {
            DESTINATIONS.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                destSelect.appendChild(opt);
            });
            const savedDest = localStorage.getItem('rememberedDest');
            if (savedDest && DESTINATIONS.includes(savedDest)) {
                destSelect.value = savedDest;
            }
        }

        const shiftTypeEl = document.getElementById('shiftType');
        const savedShift = localStorage.getItem('rememberedShift') || '早更';
        if (shiftTypeEl) shiftTypeEl.value = savedShift;

        setDefaultTime();

        db.ref('.info/connected').on('value', (snap) => {
            const statusEl = document.getElementById('cloudStatus');
            if (!statusEl) return;
            if (snap.val() === true) {
                statusEl.classList.remove('error');
                statusEl.textContent = "☁️ 雲端狀態：已連線至 driver-s-shift-report";
            } else {
                statusEl.classList.add('error');
                statusEl.textContent = "⚠️ 雲端狀態：離線中，請檢查網絡";
            }
        });

        switchDate();

        if (shiftTypeEl) {
            shiftTypeEl.addEventListener('change', function() {
                localStorage.setItem('rememberedShift', this.value);
            });
        }
        if (destSelect) {
            destSelect.addEventListener('change', function() {
                localStorage.setItem('rememberedDest', this.value);
            });
        }
    });

    function setDefaultTime() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const timeEl = document.getElementById('departTime');
        if (timeEl) timeEl.value = `${hh}:${mm}`;
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-tabs button').forEach(el => el.classList.remove('active'));
                
        const targetTab = document.getElementById(tabId);
        if (targetTab) targetTab.classList.add('active');
        if(tabId === 'tab1') {
            const btn1 = document.getElementById('tabBtn1');
            if(btn1) btn1.classList.add('active');
        }
        if(tabId === 'tab2') {
            const btn2 = document.getElementById('tabBtn2');
            if(btn2) btn2.classList.add('active');
        }
    }

    function switchDate() {
        const dateEl = document.getElementById('recordDate');
        if (!dateEl) return;
        const newDate = dateEl.value;
        if (!newDate) return;
        if (newDate === activeListenerDate && activeListener) return;

        if (activeListener && activeListenerDate) {
            db.ref('records/' + activeListenerDate).off('value', activeListener);
        }

        currentDate = newDate;
        activeListenerDate = newDate;

        const statusEl = document.getElementById('cloudStatus');
        if (statusEl) {
            statusEl.classList.remove('error');
            statusEl.textContent = "☁️ 雲端狀態：資料同步中...";
        }

        activeListener = db.ref('records/' + currentDate).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                currentDayData = {
                    plate: data.plate || '',
                    dayDriver: data.dayDriver || '',
                    nightDriver: data.nightDriver || '',
                    trips: normalizeTrips(data.trips)
                };
            } else {
                currentDayData = { plate: '', dayDriver: '', nightDriver: '', trips: [] };
            }

            const plateEl = document.getElementById('carPlate');
            const dayDriverEl = document.getElementById('dayDriver');
            const nightDriverEl = document.getElementById('nightDriver');

            if (plateEl) plateEl.value = currentDayData.plate;
            if (dayDriverEl) dayDriverEl.value = currentDayData.dayDriver;
            if (nightDriverEl) nightDriverEl.value = currentDayData.nightDriver;

            renderTable();
        }, (error) => {
            console.error(error);
            if (statusEl) {
                statusEl.classList.add('error');
                statusEl.textContent = "⚠️ 雲端狀態：連線受阻，請檢查 Firebase Rules 權限";
            }
        });
    }

    function normalizeTrips(rawTrips) {
        if (!rawTrips) return [];
        if (Array.isArray(rawTrips)) {
            return rawTrips.filter(Boolean).map((t, i) => ({
                ...t,
                id: t.id || ('legacy_' + i)
            }));
        }
        return Object.keys(rawTrips).map(k => ({
            ...rawTrips[k],
            id: k
        }));
    }

    function saveBasicInfo() {
        if (!currentDate) return;
        const plateEl = document.getElementById('carPlate');
        const dayDriverEl = document.getElementById('dayDriver');
        const nightDriverEl = document.getElementById('nightDriver');

        currentDayData.plate = plateEl ? plateEl.value.trim() : '';
        currentDayData.dayDriver = dayDriverEl ? dayDriverEl.value.trim() : '';
        currentDayData.nightDriver = nightDriverEl ? nightDriverEl.value.trim() : '';

        db.ref('records/' + currentDate).update({
            plate: currentDayData.plate,
            dayDriver: currentDayData.dayDriver,
            nightDriver: currentDayData.nightDriver
        }).catch(err => {
            console.error(err);
            alert('儲存基本資料失敗：' + err.message);
        });
    }

    function addTrip() {
        if (!currentDate) return;

        const shiftEl = document.getElementById('shiftType');
        const destEl = document.getElementById('destination');
        const timeEl = document.getElementById('departTime');
        const c9ElecEl = document.getElementById('count9Elec');
        const c6ElecEl = document.getElementById('count6Elec');
        const c9CashEl = document.getElementById('count9Cash');
        const c6CashEl = document.getElementById('count6Cash');

        const shift = shiftEl ? shiftEl.value : '早更';
        const dest = destEl ? destEl.value : '';
        const time = timeEl ? timeEl.value : '';
                
        const c9Elec = Math.max(0, parseInt(c9ElecEl ? c9ElecEl.value : 0, 10) || 0);
        const c6Elec = Math.max(0, parseInt(c6ElecEl ? c6ElecEl.value : 0, 10) || 0);
        const c9Cash = Math.max(0, parseInt(c9CashEl ? c9CashEl.value : 0, 10) || 0);
        const c6Cash = Math.max(0, parseInt(c6CashEl ? c6CashEl.value : 0, 10) || 0);

        if (!time) { alert('請選擇開出時間！'); return; }

        const elecTotal = (c9Elec * PRICE_9) + (c6Elec * PRICE_6);
        const cashTotal = (c9Cash * PRICE_9) + (c6Cash * PRICE_6);
        const total = elecTotal + cashTotal;

        const trip = {
            shift, dest, time,
            c9Elec, c6Elec, c9Cash, c6Cash,
            elecTotal, cashTotal, total,
            createdAt: Date.now()
        };

        const tripRef = db.ref('records/' + currentDate + '/trips').push();
        trip.id = tripRef.key;

        tripRef.set(trip).then(() => {
            if (c9ElecEl) c9ElecEl.value = '0';
            if (c6ElecEl) c6ElecEl.value = '0';
            if (c9CashEl) c9CashEl.value = '0';
            if (c6CashEl) c6CashEl.value = '0';
            setDefaultTime();
        }).catch(err => {
            console.error(err);
            alert('新增班次失敗：' + err.message);
        });
    }

    function renderTable() {

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function analyzeMonth() {
        const searchMonthEl = document.getElementById('searchMonth');
        const searchShiftEl = document.getElementById('searchShift');
        const targetMonth = searchMonthEl ? searchMonthEl.value : '';
        const targetShift = searchShiftEl ? searchShiftEl.value : 'ALL';

        if (!targetMonth) { alert('請選擇要查詢的月份'); return; }

        const [year, month] = targetMonth.split('-').map(Number);
        const lastDayNum = new Date(year, month, 0).getDate();
        const startDate = `${targetMonth}-01`;
        const endDate = `${targetMonth}-${String(lastDayNum).padStart(2, '0')}`;

        const statusEl = document.getElementById('cloudStatus');
        if (statusEl) {
            statusEl.textContent = "☁️ 雲端狀態：正在精準抓取月度數據...";
        }

        db.ref('records')
            .orderByKey()
            .startAt(startDate)
            .endAt(endDate + '\uf8ff')
            .once('value')
            .then((snapshot) => {
                const allRecords = snapshot.val() || {};
                const monthBody = document.getElementById('monthBody');
                const rows = [];

                let mTripsCount = 0, mTotalRev = 0;
                let m9E = 0, m6E = 0, m9C = 0, m6C = 0;

                const dates = Object.keys(allRecords).sort();
                if (dates.length === 0) {
                    if (monthBody) monthBody.innerHTML = `<tr><td colspan="9">【${targetMonth}】無任何雲端紀錄</td></tr>`;
                    const monthSummaryEl = document.getElementById('monthSummary');
                    if (monthSummaryEl) monthSummaryEl.innerHTML = `月度總結：該月份無資料`;
                    if (statusEl) {
                        statusEl.classList.remove('error');
                        statusEl.textContent = "☁️ 雲端狀態：已連線至 driver-s-shift-report";
                    }
                    return;
                }

                dates.forEach(d => {
                    const dayData = allRecords[d];
                    if (!dayData) return;
                    const trips = normalizeTrips(dayData.trips);
                    const filteredTrips = trips.filter(t => targetShift === 'ALL' || t.shift === targetShift);

                    if (filteredTrips.length > 0) {
                        let dayRev = 0, d9E = 0, d6E = 0, d9C = 0, d6C = 0;
                        filteredTrips.forEach(t => {
                            dayRev += t.total || 0;
                            d9E += t.c9Elec || 0; d6E += t.c6Elec || 0;
                            d9C += t.c9Cash || 0; d6C += t.c6Cash || 0;
                        });

                        mTripsCount += filteredTrips.length;
                        mTotalRev += dayRev;
                        m9E += d9E; m6E += d6E;
                        m9C += d9C; m6C += d6C;

                        let driverName;
                        if (targetShift === '早更') {
                            driverName = dayData.dayDriver || '-';
                        } else if (targetShift === '夜更') {
                            driverName = dayData.nightDriver || '-';
                        } else {
                            driverName = `${dayData.dayDriver || '-'}/${dayData.nightDriver || '-'}`;
                        }

                        rows.push(`<tr>
                            <td>${escapeHtml(d)}</td>
                            <td>${escapeHtml(targetShift)}</td>
                            <td>${escapeHtml(driverName)}</td>
                            <td>${filteredTrips.length}</td>
                            <td>${d9E}</td>
                            <td>${d6E}</td>
                            <td>${d9C}</td>
                            <td>${d6C}</td>
                            <td><strong>$${dayRev}</strong></td>
                        </tr>`);
                    }
                });

                if (monthBody) {
                    monthBody.innerHTML = rows.length > 0
                        ? rows.join('')
                        : `<tr><td colspan="9">【${targetMonth}】無符合條件的紀錄</td></tr>`;
                }

                const monthSummaryEl = document.getElementById('monthSummary');
                if (monthSummaryEl) {
                    monthSummaryEl.innerHTML =
                        `<strong>【${targetMonth} (${targetShift})】雲端總結：</strong><br>` +
                        `總班次：${mTripsCount} 班 | 總收入：$${mTotalRev}<br>` +
                        `<small>八達通/電子：$9 人次: ${m9E} | $6 人次: ${m6E}</small><br>` +
                        `<small>現金：$9 人次: ${m9C} | $6 人次: ${m6C}</small>`;
                }

                if (statusEl) {
                    statusEl.classList.remove('error');
                    statusEl.textContent = "☁️ 雲端狀態：已連線至 driver-s-shift-report";
                }
            })
            .catch(err => {
                console.error(err);
                if (statusEl) {
                    statusEl.classList.add('error');
                    statusEl.textContent = "⚠️ 雲端狀態：查詢失敗，請檢查權限";
                }
                alert('查詢失敗：' + err.message);
            });
    }

    function downloadCSV(csv, fileName) {
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.setAttribute("download", fileName);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    // ===== 豪華版 Excel 匯出 (ExcelJS - 內建自動 A4 分頁與排版) =====
    function getDateRange(mode) {
        const today = new Date();
        const y = today.getFullYear();
        const m = today.getMonth(); 
        const monthStr = String(m + 1).padStart(2, '0');

        if (mode === 'firstHalf') {
            return {
                start: `${y}-${monthStr}-01`,
                end: `${y}-${monthStr}-15`,
                label: `${y}年${m + 1}月 上半個月 (1–15號)`
            };
        }
        if (mode === 'secondHalf') {
            const lastDay = new Date(y, m + 1, 0).getDate();
            return {
                start: `${y}-${monthStr}-16`,
                end: `${y}-${monthStr}-${String(lastDay).padStart(2, '0')}`,
                label: `${y}年${m + 1}月 下半個月 (16–${lastDay}號)`
            };
        }
        
        const luxStartEl = document.getElementById('luxStartDate');
        const luxEndEl = document.getElementById('luxEndDate');
        const s = luxStartEl ? luxStartEl.value : '';
        const e = luxEndEl ? luxEndEl.value : '';

        if (!s || !e) {
            alert('請選擇自定開始同結束日期');
            return null;
        }
        if (s > e) {
            alert('開始日期唔可以遲過結束日期');
            return null;
        }
        return { start: s, end: e, label: `自定範圍：${s} 至 ${e}` };
    }

                    paperSize: 9,
                    orientation: 'landscape',
                    fitToPage: true,
                    fitToWidth: 1,
                    fitToHeight: 0
                },
                views: [{ state: 'frozen', ySplit: 1, showGridLines: true }]
            });
            summarySheet.sheetProperties.pageSetUpPr = { fitToPage: true };

            summarySheet.columns = [
                { header: '日期', key: 'date', width: 14 },
                { header: '車牌', key: 'plate', width: 10 },
                { header: '早更司機', key: 'dayDriver', width: 14 },
                { header: '夜更司機', key: 'nightDriver', width: 14 },
                { header: '班次數', key: 'trips', width: 10 },
                { header: '總收入(HKD)', key: 'total', width: 14 }
            ];

            const sumHeaderRow = summarySheet.getRow(1);
            sumHeaderRow.height = 30;
            sumHeaderRow.eachCell((cell) => {
                cell.font = { name: '微軟正黑體', size: 12, bold: true, color: { argb: 'FFFFFFFF' } };
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF7C3AED' } };
                cell.alignment = { horizontal: 'center', vertical: 'middle' };
                cell.border = {
                    top: { style: 'thin', color: { argb: 'FF6D28D9' } },
                    left: { style: 'thin', color: { argb: 'FF6D28D9' } },
                    bottom: { style: 'thin', color: { argb: 'FF6D28D9' } },
                    right: { style: 'thin', color: { argb: 'FF6D28D9' } }
                };
            });

            let sumRowIdx = 2;
            dates.forEach(d => {
                const day = allRecords[d];
                if (!day) return;
                const trips = normalizeTrips(day.trips);
                if (trips.length > 0) {
                    const dayTotal = trips.reduce((s, t) => s + (t.total || 0), 0);
                    const row = summarySheet.addRow({
                        date: d,
                        plate: day.plate || '-',
                        dayDriver: day.dayDriver || '-',
                        nightDriver: day.nightDriver || '-',
                        trips: trips.length,
                        total: dayTotal
                    });

                    const isEven = sumRowIdx % 2 === 0;
                    row.eachCell((cell) => {
                        cell.font = { name: '微軟正黑體', size: 11, color: { argb: 'FF0F172A' } };
                        cell.alignment = { horizontal: 'center', vertical: 'middle' };
                        cell.fill = {
                            type: 'pattern',
                            pattern: 'solid',
                            fgColor: { argb: isEven ? 'FFF8FAFC' : 'FFFFFFFF' }
                        };
                        cell.border = {
                            top: { style: 'thin', color: { argb: 'FFE2E8F0' } },
                            left: { style: 'thin', color: { argb: 'FFE2E8F0' } },
                            bottom: { style: 'thin', color: { argb: 'FFE2E8F0' } },
                            right: { style: 'thin', color: { argb: 'FFE2E8F0' } }
                        };
                    });
                    row.getCell('total').font = { name: '微軟正黑體', size: 11, bold: true, color: { argb: 'FF059669' } };
                    sumRowIdx++;
                }
            });

            // ===== 下載 =====
            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `豪華行車報表_${range.start}_至_${range.end}.xlsx`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 5000);

            if (statusEl) statusEl.textContent = "☁️ 雲端狀態：已連線至 driver-s-shift-report";
        } catch (err) {
            console.error(err);
            if (statusEl) {
                statusEl.classList.add('error');
                statusEl.textContent = "⚠️ 雲端狀態：匯出失敗";
            }
            alert('豪華版 Excel 匯出失敗：' + err.message);
        }
    }
</script>
</body>
</html>
